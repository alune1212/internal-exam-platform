name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: internal_exam_test
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: local-dev-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exam -d internal_exam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      ACCOUNT_MIGRATION_ALLOW_UNGATED_DEVELOPMENT: "true"
      ACCOUNT_MIGRATION_DISPOSABLE_DATABASE: "true"
      DATABASE_URL: postgresql+psycopg://exam:local-dev-postgres-password@127.0.0.1:5432/internal_exam_test
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://exam:local-dev-postgres-password@127.0.0.1:5432/internal_exam_test
      POSTGRES_TEST_DATABASE_DISPOSABLE: "true"
      POSTGRES_TEST_DATABASE_PORT: "5432"
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: local-dev-admin-password
      TOKEN_SECRET: local-dev-token-secret-change-before-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: backend
      - name: Sync backend
        working-directory: backend
        run: uv sync
      - name: Alembic upgrade
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .
      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .
      - name: Type check
        working-directory: backend
        run: uv run ty check
      - name: Backend tests
        working-directory: backend
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Format check
        working-directory: frontend
        run: npm run format:check
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Offline runtime asset gate
        working-directory: frontend
        run: npm run check:offline

  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install gate dependencies
        run: |
          cd backend
          uv sync --frozen
          cd ../frontend
          npm ci
          npm run build
      - name: Verify deployment and security workflow contracts
        working-directory: backend
        run: uv run pytest app/tests/test_deployment_config.py app/tests/test_capacity_gate.py app/tests/test_security_scan_gate.py
      - name: Reject retired candidate identity contracts
        run: python3 scripts/check-legacy-contracts.py
      - name: Verify no public runtime dependency
        working-directory: frontend
        run: npm run check:offline
      - name: Validate OpenSpec consistency
        run: |
          npm install --global @fission-ai/openspec@1.6.0
          openspec validate --all --strict --no-interactive
      - name: Generate checksummed passing policy fixture
        env:
          SECURITY_EVIDENCE_DIR: ${{ runner.temp }}/security-evidence
        run: |
          python ops/security/evaluate_scans.py \
            --repository . \
            --pip-audit ops/security/fixtures/empty-pip-audit.json \
            --npm-audit ops/security/fixtures/empty-npm-audit.json \
            --trivy ops/security/fixtures/empty-trivy.json \
            --image-record ops/security/fixtures/example-final-images.json \
            --output-dir "$SECURITY_EVIDENCE_DIR"
  browser-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run disposable Compose browser gate
        run: sh ops/e2e/run-browser-gate.sh
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ github.run_id }}
          path: |
            .runtime/e2e/browser-output/playwright-report/
            .runtime/e2e/browser-output/test-results/
          if-no-files-found: ignore

  capacity-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run disposable 100-client capacity gate
        run: sh ops/e2e/run-capacity-gate.sh
      - name: Upload capacity evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-gate-${{ github.run_id }}
          path: .runtime/e2e/capacity-runs/
          if-no-files-found: error
