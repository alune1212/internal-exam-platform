name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: internal_exam_test
          POSTGRES_USER: exam
          POSTGRES_PASSWORD: local-dev-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exam -d internal_exam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://exam:local-dev-postgres-password@127.0.0.1:5432/internal_exam_test
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://exam:local-dev-postgres-password@127.0.0.1:5432/internal_exam_test
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: local-dev-admin-password
      TOKEN_SECRET: local-dev-token-secret-change-before-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: backend
      - name: Sync backend
        working-directory: backend
        run: uv sync
      - name: Alembic upgrade
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .
      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .
      - name: Type check
        working-directory: backend
        run: uv run ty check
      - name: Backend tests
        working-directory: backend
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Format check
        working-directory: frontend
        run: npm run format:check
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
