[project]
name = "internal-exam-platform-backend"
version = "0.1.0"
description = "FastAPI backend for the internal exam platform."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.9.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.40",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.15.17",
    "ty>=0.0.49",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

# ---------- Ruff ----------

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade (modernize syntax for 3.12+)
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
    "S",      # flake8-bandit (security)
    "TC",     # flake8-type-checking
    "FAST",   # FastAPI-specific rules
    "C4",     # flake8-comprehensions
    "PT",     # flake8-pytest-style
    "A",      # flake8-builtins
    "T20",    # flag stray print() calls
    "PERF",   # perflint
]
ignore = [
    "E501",    # line-too-long -- formatter handles this
    "B008",    # function-call-in-default-argument -- FastAPI Depends() pattern
    "FAST001", # fast-api-redundant-response-model -- explicit response_model for docs
    "FAST002", # fast-api-non-annotated-dependency -- Depends(get_db) style
    "RUF001",  # ambiguous-unicode-character-string -- Chinese strings
    "RUF002",  # ambiguous-unicode-character-docstring -- Chinese docstrings
    "RUF003",  # ambiguous-unicode-character-comment -- Chinese comments
    "S101",    # assert used -- expected in tests
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/tests/**" = ["S101", "T20", "RUF059"]
"**/alembic/**" = ["E501", "B"]
"**/config.py" = ["S105"]
"**/auth.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------- ty ----------

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.terminal]
output-format = "full"
error-on-warning = false
