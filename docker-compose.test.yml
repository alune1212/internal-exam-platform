services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: internal_exam_test
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: local-dev-postgres-password
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d internal_exam_test"]
      interval: 2s
      timeout: 5s
      retries: 15
