services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: internal_exam
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d internal_exam"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      TOKEN_SECRET: ${TOKEN_SECRET:?Set TOKEN_SECRET in .env}
      LEARNING_MEDIA_STORAGE_DIR: ${LEARNING_MEDIA_STORAGE_DIR:-/app/learning-media}
      LEARNING_MEDIA_PUBLIC_PATH: ${LEARNING_MEDIA_PUBLIC_PATH:-/media/learning}
      LEARNING_VIDEO_MAX_UPLOAD_BYTES: ${LEARNING_VIDEO_MAX_UPLOAD_BYTES:-524288000}
      LEARNING_VIDEO_ALLOWED_CONTENT_TYPES: ${LEARNING_VIDEO_ALLOWED_CONTENT_TYPES:-video/mp4,video/webm}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - learning_media:/app/learning-media
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]

  auto-submit-worker:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      TOKEN_SECRET: ${TOKEN_SECRET:?Set TOKEN_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    command: ["uv", "run", "python", "-m", "app.core.auto_submit_worker"]

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - learning_media:/var/lib/nginx/learning-media:ro

volumes:
  postgres_data:
  learning_media:
