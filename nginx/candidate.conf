limit_req_zone $binary_remote_addr zone=candidate_login:10m rate=10r/m;

server {
  listen 80;
  server_name _;

  resolver 127.0.0.11 ipv6=off valid=10s;
  set $backend_upstream http://backend:8000;
  set $frontend_upstream http://frontend:80;

  client_max_body_size 10m;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;

  location ^~ /admin { return 404; }
  location = /operations { return 404; }
  location ^~ /operations/ { return 404; }
  location ^~ /api/admin/ { return 404; }
  location ^~ /api/imports { return 404; }
  location ^~ /api/questions { return 404; }
  location ^~ /api/reports { return 404; }
  location ^~ /api/operations { return 404; }
  location = /api/ready { return 404; }
  location = /docs { return 404; }
  location = /openapi.json { return 404; }

  location = /api/candidates/login {
    limit_req zone=candidate_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass $backend_upstream/api/candidates/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /media/learning/ {
    add_header Accept-Ranges bytes always;
    alias /var/lib/nginx/learning-media/;
  }

  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    proxy_pass $frontend_upstream;
    proxy_set_header Host $host;
  }
}
